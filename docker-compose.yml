services:
  postgres:
    image: postgres:17-alpine
    container_name: context-whisperer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: context_whisperer
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d context_whisperer']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
